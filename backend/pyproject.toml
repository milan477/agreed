[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agreed"
version = "0.1.0"
description = "Agentic negotiation platform — better agreements, faster."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Sponsor integrations. The core runs without these; install what you have keys for.
full = [
    "openai>=1.30",
    "weave>=0.51",
    "wandb>=0.17",
    "langgraph>=0.2",
    "dspy-ai>=2.4",
    "e2b-code-interpreter>=1.0",
    "exa-py>=1.0",
    "redis>=5.0",
    "mem0ai>=0.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "twilio>=9.0",
]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agreed*"]

[tool.ruff]
line-length = 110
